name: Build and publish Sudoku 16x16 dataset
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'New immutable release tag (e.g. dataset-v1)'
        required: true
        default: 'dataset-v1'
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include:
          - {tier: easy, shard: 0, count: 500}
          - {tier: easy, shard: 1, count: 500}
          - {tier: easy, shard: 2, count: 500}
          - {tier: easy, shard: 3, count: 500}

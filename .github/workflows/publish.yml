          - {tier: hard, shard: 59, count: 500}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - run: python scripts/generate.py --tier ${{ matrix.tier }} --shard ${{ matrix.shard }} --count ${{ matrix.count }} --out out
      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.tier }}-${{ matrix.shard }}
          path: out/*.bin
          retention-days: 30
  publish:
    needs: generate
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: shard-*
          path: shards
          merge-multiple: true
      - run: python scripts/package.py --input shards --out release --version '${{ inputs.tag }}'
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then echo 'Tag exists; refusing overwrite'; exit 1; fi
          gh release create "$TAG" release/*.bin release/manifest.json --title "$TAG" --notes '16x16 Sudoku offline dataset; clue-count tiers; each puzzle uniqueness checked during generation.'
